name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test tools
        run: |
          pip install build
          # `.[dev]` and not `.` -- torch and numpy are OPTIONAL extras here, and
          # without them every test module skips at import. The first release run
          # proved it: "3 skipped in 0.03s", pytest exit 5. That exit is the ONLY
          # thing that stopped an untested artifact reaching PyPI, because a
          # suite where nothing ran is otherwise indistinguishable from one that
          # passed. Install what the tests actually need.
          pip install -e ".[dev]"
          pip install pytest-timeout
      - name: Run the test suite before publishing
        run: |
          # `-p no:randomly` is not needed; what IS needed is a floor. pytest
          # exits 5 when nothing is collected, which reads as a generic failure;
          # this says what actually happened.
          python -m pytest tests/ -q --timeout=180 || {
            rc=$?
            [ "$rc" = "5" ] && echo "::error::no tests ran - the suite skipped everything, most likely a missing optional dependency. Refusing to publish an untested artifact."
            exit $rc
          }
      - name: Build package
        run: python -m build
      - name: Moat guard (inspect built wheel + sdist)
        run: python scripts/check_moat_boundary.py
      - name: Confirm this version reached PyPI
        # PyPI trusts the MONOREPO's publish lane for this package, not this repo: an
        # upload from here fails the trusted-publishing exchange on every release while
        # the real publish succeeds elsewhere. Check the outcome instead -- the version
        # must be on PyPI within 30 minutes of the release.
        run: |
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$ver/json")
            if [ "$code" = 200 ]; then echo "$name $ver is on PyPI"; exit 0; fi
            sleep 30
          done
          echo "::error::$name $ver is not on PyPI 30 min after the release -- check the monorepo lane 'Publish bricks (paced)'"
          exit 1
